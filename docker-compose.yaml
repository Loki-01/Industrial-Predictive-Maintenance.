version: '3.8'

services:
  mqtt:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
    networks:
      - industrial-net

  influxdb:
    image: influxdb:2.0
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=algeria_predict
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry_data
      - DOCKER_INFLUXDB_INIT_ADMINTOKEN=my-token
    networks:
      - industrial-net

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    networks:
      - industrial-net

  simulator:
    build: .
    command: python simulator.py
    depends_on:
      - mqtt
    networks:
      - industrial-net

networks:
  industrial-net:
    driver: bridge
